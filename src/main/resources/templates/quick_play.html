<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Quick Play</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <link rel="icon" type="image/x-icon" href="/img/logos/logo_4.png">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/quick_play.css">
</head>

<body style="overflow-x: hidden;">
    <!-- <div style="display: flex; align-items: center; justify-content: center;">
        <span id="test_span" style="color: gray">Status</span>
        <button id="join_game">Join Game</button>
    </div> -->

    <div style="display: flex;flex-direction: column;align-items: center;">
        <section class="py-4 py-xl-5">
            <div class="container">
                <div class="bg-dark border rounded border-0 border-dark overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-6" style="background-color: #c29efe;">
                            <div class="text-white p-4 p-md-5">
                                <h2 class="fw-bold text-white mb-3" style="text-align: center;"><span style="color: rgb(0, 0, 0);">Quick Play</span></h2>
                                <p class="mb-4" style="text-align: center;"><strong><span style="color: rgb(0, 0, 0);">Join a quick play game by clicking the button below! You will be automatically paired with other players.</span></strong></p>
                                <div class="my-3" style="flex-direction: column; display: flex;align-items: center; justify-content: space-between; height: 140px;">
                                    <button class="btn btn-primary" type="button" id="join_game">Join</button>
                                    <!-- <div>
                                        <span>Matchmaking</span>
                                        <div class="col-3">
                                        <div class="snippet" data-title="dot-pulse">
                                          <div class="stage">
                                            <div class="dot-pulse"></div>
                                          </div>
                                        </div>
                                      </div>
                                    </div> -->
                                    <div style="display: flex; flex-direction: column; display: none;" id="status_div">
                                        <p>Matchmaking</p>
                                        <div class="l-container">
                                            <div class="loading-dots">
                                                <span></span>
                                                <span></span>
                                                <span></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 order-first order-md-last" style="min-height: 250px;"><img class="w-100 h-100 fit-cover" src="/img/quick_play.jpg" /></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/quick_play.js" type="module"></script>
</body>

</html>
