<!DOCTYPE html>
<html>
<head>
	<title>Game Page</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		
		html, body {
			height: 100%;
			background-color: #f2f2f2;
		}
		
		.container {
			display: grid;
			grid-template-columns: 30% 40% 30%;
			grid-template-rows: 20% 50% 30%;
			gap: 10px;
			margin: 20px;
			height: calc(100% - 40px);
            text-align: center;
		}
		
		.row1col1, .row1col3 {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 20%;
			width: 30%;
		}
		
		.row1col2 {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 20%;
			width: 40%;
		}
		
		.row2col1, .row2col3 {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 50%;
			width: 30%;
		}
		
		.row2col2 {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 50%;
			width: 40%;
		}
		
		.row3col1, .row3col3 {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 30%;
			width: 30%;
		}
		
		.row3col2 {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #fff;
			font-size: 24px;
			height: 30%;
			width: 40%;
		}
		
		input[type="text"] {
			font-size: 24px;
			padding: 10px;
			margin-top: 10px;
			border-radius: 5px;
			border: none;
			background-color: #f2f2f2;
		}
		
		input[type="submit"] {
			background-color: #4CAF50;
			color: white;
			cursor: pointer;
		}
        .answer-field {
            width: 70%;
            padding: 10px;
            border-radius: 5px 0 0 5px;
            border: none;
            background-color: #f5f5f5;
            margin-right: -5px;
        }

        .answer-field:focus {
            outline: none;
        }

        .answer-field-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            width: 33.33%;
        }
        /* Submit Buttons */
    .submit-button {
        padding: 10px 20px;
        background-color: #2196f3;
        color: white;
        border: none;
        border-radius: 0 5px 5px 0;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .submit-button:hover {
        background-color: #0c7cd5;
    }

    .invite-button {
        padding: 10px 20px;
        background-color: #e0e0e0;
        color: black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .invite-button:hover {
        background-color: #bdbdbd;
    }
	</style>
</head>

<body>
	<div class="container">
		<div class="row1col1">
			<span>Player 1 Score: 0</span>
        </div>
        <div class="row1col2">
            <span>Timer: 00:00</span>
        </div>
        <div class="row1col3">
            <span>Player 2 Score: 0</span>
        </div>
		<div class="row2col1">
            <h3>Player 1</h3>
            <p>Level: 1</p>
            <p>Stats: 0 wins, 0 losses</p>
            <p>Badges: None</p>
        </div>
        <div class="row2col2">
            <p>What is 2 + 2?</p>
            <button class="start-button">Start</button>
        </div>
        <div class="row2col3">
            <h3>Player 2</h3>
            <p>Level: 1</p>
            <p>Stats: 0 wins, 0 losses</p>
            <p>Badges: None</p>
        </div>
        <div class="row3col1">
            <input type="text" class="answer-field" placeholder="Enter answer...">
            <button class="submit-button">Submit</button>
        </div>
        <div class="row3col2">
            <button class="invite-button">Invite Your Friends</button>
        </div>
        <div class="row3col3">
            <input type="text" class="answer-field" placeholder="Enter answer...">
            <button class="submit-button">Submit</button>
        </div>
	</div>
</body>
</html>
