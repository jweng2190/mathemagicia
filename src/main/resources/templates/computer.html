                                <form id="cg_form" class="text-center" method="post">
                                    <div class="mb-3">
                                        <div class="dropdown">
                                            <button id="diff_button" class="btn btn-primary dropdown-toggle" aria-expanded="false" data-bs-toggle="dropdown" type="button" style="margin-bottom: 10px;">Difficulty</button>
                                            <div class="dropdown-menu">
                                                <a id="easy" class="dropdown-item" href="#" style="background: #50C878;">Easy</a>
                                                <a id="medium" class="dropdown-item" href="#" style="background: #FDDA0D;">Medium</a>
                                                <a id="hard" class="dropdown-item" href="#" style="background: #D22B2B;">Hard</a>
                                            </div>
                                        </div>
                                        <input type="text" style="display:none" id="difficulty" name="difficulty" value="medium"/>
                                    </div>
                                    <div class="mb-3">
                                        <div class="dropdown">
                                            <button id="time_button" class="btn btn-primary dropdown-toggle" aria-expanded="false" data-bs-toggle="dropdown" type="button" style="margin-bottom: 15px;">
                                                Time Limit<!-- <img style="height: 25px;width: auto;margin-left: 17px;" src="/img/flash.png"> --></button>
                                            <div class="dropdown-menu">
                                                <a id="lightning" class="dropdown-item" href="#">5:00<img style="height: 25px;width: auto;margin-left: 17px;" src="/img/flash.png"></a>
                                                <a id="speed" class="dropdown-item" href="#">10:00<img style="height: 25px;width: auto;margin-left: 10px;" src="/img/hourglass.png"></a>
                                                <a id="standard" class="dropdown-item" href="#">20:00<img style="height: 25px;width: auto;margin-left: 10px;" src="/img/timer.png"></a>
                                            </div>
                                        </div>
                                        <input type="text" style="display:none" id="time" name="time" value="10:00"/>
                                    </div>
                                    <div>
                                        <span style="color: #0d6efd;font-weight: 600;">Bot Level</span>
                                    </div>
                                    <div style="display: flex;">
                                        <input id="diff" name="computerLevel" type="range" min="1" max="10" step="1" required value="5" style="margin: auto;" /><span id="diff_disp" style="margin-left: 10px;">5</span>
                                    </div>
                                    <div class="mb-3">
                                        <button class="create btn btn-primary d-block w-100" type="submit" style="background: var(--bs-code-color); margin-top: 25px;">Create!</button>
                                    </div>
                                    <p id="status" style="color: green"></p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
