<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row; /* Horizontal layout */
        }

        .left-div {
            flex: 0 0 6%; /* 6% width, no flex-grow, no flex-shrink */
            background-color: lightblue;
        }

        .right-div {
            flex: 1; /* 1 will take up the remaining space */
            background-color: lightcoral;
            text-align: right;
            padding-right: 20px; /* Optional: Add some padding on the right */
        }

        /* Media query for smaller screens */
        @media (max-width: 768px) {
            .left-div,
            .right-div {
                flex: 1; /* Full width for both divs on smaller screens */
            }
        }
    </style>
</head>
<body>

<div class="left-div">
    <!-- Content for the left div goes here -->
    <p>Stuff 1</p>
</div>

<div class="right-div">
    <!-- Content for the right div goes here -->
    <p>Stuff 2</p>
</div>

</body>
</html>
