<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Past Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/past_games.css">
</head>

<body style="height: 100%;">
    <div class="d-flex flex-column align-items-center" style="height: 100%;">
        <section class="py-4 py-xl-5">
            <div class="container">
                <div class="text-center p-4 p-lg-5" style="height: 2.5em;">
                    <h1 class="fw-bold mb-4">Past Games</h1>
                </div>
            </div>
        </section>
        <div class="table-responsive" style="width: 85%;table-layout: fixed;">
            <table id="past_games" class="table table-hover">
                <thead>
                    <tr>
                        <th id="players" style="height: 35%;width: 35%;">Players</th>
                        <th id="result" style="height: 25%;width: 25%;">Result</th>
                        <th id="details" style="width: 20%;">Review</th>
                        <th id="date_played" style="width: 20%;">Date</th>
                    </tr>
                </thead>
                <tbody>    
                </tbody>
            </table>
        </div>
        <template id="no_games"><p>No games yet. To get started, <a href="/create_game">create a game</a>!</p></template>
        <!-- <div id="pagination">
            <button id="prevPage">Previous</button>
            <span id="currentPage">Page 1</span>
            <button id="nextPage">Next</button>
        </div> -->
        <!-- HTML for pagination controls -->
        <div id="pagination" style="padding-bottom: 3.5%;">
            <a id="prevPage" href="#" style="border: 1px solid #c4c8d8;border-radius: 5px;transition: background-color .2s ease-out;text-decoration: none;margin-right: 10px;">&lt;</a>
            <span id="currentPage">...</span>
            <a id="nextPage" href="#" style="border: 1px solid #c4c8d8;border-radius: 5px;transition: background-color .2s ease-out;text-decoration: none;margin-left: 10px;">&gt;</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/past_games.js"></script>
</body>

</html>
