<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Past Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/past_games.css">
</head>

<body style="height: 100%;">
    <div class="d-flex flex-column align-items-center" style="height: 100%;">
        <section class="py-4 py-xl-5">
            <div class="container">
                <div class="text-center p-4 p-lg-5" style="height: 2.5em;">
                    <h1 class="fw-bold mb-4">Past Games</h1>
                </div>
            </div>
        </section>
        <div class="table-responsive" style="width: 85%;table-layout: fixed;">
            <table id="past_games" class="table table-hover">
                <thead>
                    <tr>
                        <th id="players" style="height: 35%;width: 35%;">Players</th>
                        <th id="result" style="height: 25%;width: 25%;">Result</th>
                        <th id="details" style="width: 20%;">Review</th>
                        <th id="date_played" style="width: 20%;">Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="d-flex">
                                <img id="pfp1_1" style="width: 25px;height: 25px;margin-right: 18px;">
                                <p id="player1_username_1" style="width: 75%;height: 25px;"><span style="color: rgb(0, 0, 0); background-color: transparent;">awoej;lkjeifjapwojf</span></p>
                            </div>
                            <div class="d-flex">
                                <img id="pfp2_1" style="width: 25px;height: 25px;margin-right: 18px;">
                                <p id="player2_username_1"style="width: 75%;height: 25px;"><span style="color: rgb(0, 0, 0); background-color: transparent;">awoeifjapwoeifjapwojf</span></p>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex">
                                <p style="width: 25%;">0</p>
                                <img src="/img/red_minus.svg" style="width: 25px;height: 25px;">
                            </div>
                            <div class="d-flex">
                                <p style="width: 25%;">1</p>
                                <img src="/img/green_plus.svg" style="width: 25px;height: 25px;">
                            </div>
                        </td>
                        <td><a href="#">Details</a></td>
                        <td>09/25/2023</td>
                    </tr>
                    <tr>
                        <td style="height: 100px;">Cell 3</td>
                        <td>Text</td>
                        <td><a href="#">Details</a></td>
                        <td>Cell 4</td>
                    </tr>
                    <tr>
                        <td style="height: 100px;">Text</td>
                        <td>Text</td>
                        <td>Text</td>
                        <td>Text</td>
                    </tr>
                    <tr>
                        <td style="height: 100px;">Text</td>
                        <td>Text</td>
                        <td>Text</td>
                        <td>Text</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/past_games.js"></script>
</body>

</html>
