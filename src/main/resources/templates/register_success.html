<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Account Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" type="image/x-icon" href="/img/logos/logo_4.png">
</head>

<body style="background: url(&quot;/img/background.jpg&quot;) center / auto no-repeat;">
    <div class="d-flex flex-column justify-content-center align-items-center" style="padding-top: 55px;align-items: center;"><img src="/img/green_check.svg">
        <h1 style="color: white;">Account Verification</h1>
        <p style="color: white;height: 66px;"><br>A verification code has been sent to your email. To verify your account, please enter the code below.</p>
        <form id="verification_form">
            <div style="display: flex; justify-content: center; flex-direction: column; align-items: center;">
                <input class="form-control" type="text" id="verification_code" name="verification_code" placeholder="Enter Verification Code" required minlength="36" maxlength="36">
                <button id="verify_button" type="submit" class="btn btn-primary" style="margin-top: 10px;">Verify Account</button>
            </div>

            <p id="resend_msg" class="mt-3" style="display: none; color: rgb(255, 235, 16);">Verification code resent to your email.</p>
        </form>

        <button id="resend_code" class="btn btn-link">Resend Code</button>

        <p style="display: none; margin-top: 10px;" id="status_msg"></p>
        <button id="register_login" style="margin-top: 10px; display: none;" class="btn btn-primary" type="button" onclick="location.href = '/login';">Click Here To Log In</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/verify.js"></script>
</body>

</html>
