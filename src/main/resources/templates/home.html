<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"
            integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.4.0/sockjs.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="container text-center">
        <h1>Mathemagicia Home</h1>
        <h3><a href="/logout">Logout</a></h3>
        <h3><a id="mathcounts">Mathcounts Game</a></h3>
        <h3><a id="amc8">AMC 8 Game</a></h3>
        <h3><a id="game_home" href="/game_home" onclick="connect();">1v1 Mathcounts</a></h3>
        <h3><button onclick="sendHello();return false;">Send Hello</h3>
    </div>
</body>

<script>
    document.body.onload = function() {
      if(localStorage.getItem('mathcountsId') != null) {
        const value = localStorage.getItem('mathcountsId');
        const url = `/view?contest=mathcounts&problemId=${value}`;
        const a = document.querySelector('#mathcounts');   
        a.href = url;
      } else {
        localStorage.setItem('mathcountsId', 1);
        const url = `/view?contest=mathcounts&problemId=1`;
        const a = document.querySelector('#mathcounts');   
        a.href = url;
      }

      if(localStorage.getItem('amc8Id') != null) {
        const value = localStorage.getItem('amc8Id');
        const url = `/view?contest=amc8&problemId=${value}`;
        const a = document.querySelector('#amc8');   
        a.href = url;
      } else {
        localStorage.setItem('amc8Id', 4);
        const url = `/view?contest=amc8&problemId=4`;
        const a = document.querySelector('#amc8');   
        a.href = url;
      }
     }
</script>
<script src="/js/app.js"></script>
</html>
