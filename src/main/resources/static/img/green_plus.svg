<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Transparent background -->
  <rect x="0" y="0" width="100" height="100" fill="none" />

  <!-- Green circular border -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#00FF00" stroke-width="8" />

  <!-- Green plus sign with less rounded corners -->
  <rect x="40" y="25" width="20" height="50" fill="#00FF00" rx="5" />
  <rect x="25" y="40" width="50" height="20" fill="#00FF00" rx="5" />
</svg>
