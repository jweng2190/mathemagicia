<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Transparent background -->
  <rect x="0" y="0" width="100" height="100" fill="none" />

  <!-- Gray circular border -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#808080" stroke-width="8" />

  <!-- Gray equals sign with less rounded corners -->
  <rect x="25" y="30" width="50" height="15" fill="#808080" rx="5" />
  <rect x="25" y="55" width="50" height="15" fill="#808080" rx="5" />
</svg>
